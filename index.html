{t:'Pros and cons of OOP',e:`<div class="cols"><div class="card"><h4>Advantages</h4><ul><li>Order: everything has its place.</li><li>You reuse code instead of copying it.</li><li>You model the real world with familiar ideas.</li><li>Changing one class fixes all its objects.</li></ul></div><div class="card"><h4>Disadvantages</h4><ul><li>It can be too much for small programs.</li><li>It is harder to learn at first.</li><li>Many tangled classes are hard to follow.</li><li>It is often slower than a simple script.</li></ul></div></div><p>See the difference: without OOP you repeat dictionaries; with OOP the logic lives next to the data.</p>`,
c:`# Without OOP: data and actions are separate

{t:'OOP principles',e:`<p>OOP rests on four ideas. You will meet each one in the next lessons:</p><ul><li><b>Encapsulation:</b> protect the object’s data.</li><li><b>Abstraction:</b> show only what is necessary.</li><li><b>Inheritance:</b> one class inherits from another.</li><li><b>Polymorphism:</b> the same method acts differently depending on the object.</li></ul><p>Run this example and look for all four.</p>`,
c:`class Animal:

  rs.onclick=()=>{ta.value=code;out.textContent='Output appears here.';out.className='out'};
  ta.onkeydown=e=>{
    if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end')}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();go.click()}
  };
  return w;
}

function diagram(){
  const w=document.createElement('div');w.className='card';
  const st={sleep:false,ov:false};
  function draw(){
    const base=['eat()','speak()'].concat(st.sleep?['sleep()']:[]);
    const kids=[['Dog','fetch()'],['Cat','purr()'],['Bird','fly()']];
    const kid=([n,own])=>{
      const ov=n==='Cat'&&st.ov;
      const inh=base.filter(m=>!(ov&&m==='speak()'));
      return `<div class="node"><h4>${n}</h4><ul><li class="own">${own}</li>${ov?'<li class="ov">speak() overrides</li>':''}${inh.map(m=>`<li class="inh">↑ ${m}</li>`).join('')}</ul></div>`};
    w.innerHTML=`<div class="tree"><div class="node root"><h4>Animal (parent)</h4><ul>${base.map(m=>`<li class="own">${m}</li>`).join('')}</ul></div><div class="kids">${kids.map(kid).join('')}</div></div><div class="bar free"><button class="b" id="a1" ${st.sleep?'disabled':''}>Add sleep() to Animal</button><button class="b alt" id="a2">${st.ov?'Undo':'Cat overrides speak()'}</button><small>↑ means “inherited from the parent”.</small></div>`;
    w.querySelector('#a1').onclick=()=>{st.sleep=true;draw()};
    w.querySelector('#a2').onclick=()=>{st.ov=!st.ov;draw()};
  }
  draw();return w;
}
function quiz(){
  const w=document.createElement('div');w.className='card';
  w.innerHTML='<h4>Blueprint or object?</h4>';
  [['Pet (the plan)','class'],['luna, the cat you created','object'],['The plan for building cars','class'],['My red car at the door','object'],['Dog','class'],['rocky = Dog()','object']].forEach(([t,a])=>{
    const r=document.createElement('div');r.className='q';r.innerHTML='<span></span><span class="acts"></span><span class="r"></span>';
    r.firstChild.textContent=t;
    [['class','Blueprint (class)'],['object','Object']].forEach(([o,lb])=>{const b=document.createElement('button');b.className='b alt';b.textContent=lb;
      b.onclick=()=>{const s=r.querySelector('.r');const ok=o===a;s.textContent=ok?'Correct!':'Try again';s.className='r '+(ok?'good':'bad')};r.querySelector('.acts').appendChild(b)});
    w.appendChild(r)});
  return w;
}

const HELPER=`import json
_pets=[]
def _cls():
    cs=[v for v in globals().values() if isinstance(v,type) and v.__module__=='__main__']
    return cs[-1]
def _new(n):
    _pets.append(_cls()(n)); return len(_pets)-1
def _info(i):
    o=_pets[i]; t=type(o)
    return json.dumps({"cls":t.__name__,"attrs":{k:repr(v) for k,v in vars(o).items()},"methods":[m for m in dir(t) if not m.startswith('_') and callable(getattr(t,m))]})`;
const LAB=`class Pet:
    def __init__(self, name):
        self.name = name
        self.energy = 5

    def eat(self):
        self.energy += 2
        print(self.name, "munches happily")

    def speak(self):
        print(self.name, "says hi!")
`;
function lab(){
  const w=document.createElement('div');
  w.innerHTML='<p>Edit the class, press <b>Build class</b>, then create pets. Each card shows that pet’s own data and a button for every method. Try adding an <code>age</code> attribute or a <code>play()</code> method, then build again. Methods that need extra arguments can’t be clicked here.</p><textarea spellcheck="false" aria-label="Class editor"></textarea><div class="bar"><button class="b">🔨 Build class</button><label>Name <input value="Luna" maxlength="12"></label><button class="b alt">➕ Create pet</button></div><pre class="out" aria-live="polite">Build your class to start.</pre><div class="pets"></div>';
  const ta=w.querySelector('textarea'),[bb,cb]=w.querySelectorAll('button'),inp=w.querySelector('input'),out=w.querySelector('pre'),box=w.querySelector('.pets');
  ta.value=LAB;ta.rows=16;let g=null;
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end')}};
  const info=i=>JSON.parse(py.runPython('_info('+i+')',{globals:g}));
  function fill(card,i){
    const d=info(i);
    card.querySelector('.at').textContent=Object.entries(d.attrs).map(([k,v])=>'self.'+k+' = '+v).join('\n');
    return d}
  bb.onclick=async()=>{
    await ready;if(!py){noPy(out);return}box.innerHTML='';out.className='out';
    if(g)g.destroy();g=py.globals.get('dict')();g.set('__name__','__main__');
    const buf=[];py.setStdout({batched:s=>buf.push(s)});
    try{py.runPython(ta.value,{globals:g});py.runPython(HELPER,{globals:g});py.runPython('_cls()',{globals:g});out.textContent='Class built ✓. Now create a pet.'}
    catch(e){g.destroy();g=null;out.textContent='';const m=document.createElement('div');m.className='bad';m.textContent='Python error: '+lastLine(e);out.appendChild(m)}
  };
  cb.onclick=()=>{
    if(!g){out.textContent='Build your class first.';return}
    try{
      g.set('_n',inp.value.trim()||'Pet');const i=py.runPython('_new(_n)',{globals:g});
      const card=document.createElement('div');card.className='card pet';
      card.innerHTML='<div class="face">🐾</div><h4></h4><div class="at"></div><div class="bub">I haven’t done anything yet.</div><div class="acts"></div>';
      const d=fill(card,i);card.querySelector('h4').textContent=d.cls+' #'+(i+1);
      d.methods.forEach(m=>{const b=document.createElement('button');b.className='b alt';b.textContent=m+'()';
        b.onclick=()=>{const buf=[];py.setStdout({batched:s=>buf.push(s)});let t;
          try{const r=py.runPython(`__r=_pets[${i}].${m}()\nNone if __r is None else repr(__r)`,{globals:g});t=buf.join('\n')+(r?'\n→ '+r:'')}catch(e){t='Error: '+lastLine(e)}
          card.querySelector('.bub').textContent=t||'(done)';fill(card,i)};
        card.querySelector('.acts').appendChild(b)});
      box.appendChild(card);out.textContent='Pet created ✓';mark('lab');
    }catch(e){out.textContent='Could not create the pet: '+lastLine(e)+'. Does your constructor accept just a name?'}
  };
  return w;
}

function drawNav(){
  const n=$('nav');n.querySelectorAll('button,hr').forEach(b=>b.remove());
  P.forEach((l,i)=>{
    if(l.lab)n.appendChild(document.createElement('hr'));
    const ok=l.extra?EX.every((_,j)=>done.has('x'+j)):done.has(l.lab?'lab':'l'+i);
    const b=document.createElement('button');if(i===cur)b.className='on';
    b.innerHTML='<span class="n">'+(i<L.length?i+1:'')+'</span><span></span><span class="ck">'+(ok?'✓':'')+'</span>';
    b.children[1].textContent=l.t;b.onclick=()=>{cur=i;show();scrollTo(0,0)};n.appendChild(b)});
}
function show(){
  const l=P[cur],m=$('main');drawNav();m.innerHTML='';
  const h=document.createElement('h2');h.textContent=(cur<L.length?(cur+1)+'. ':'')+l.t;m.appendChild(h);
  if(l.lab)m.appendChild(lab());
  else if(l.extra){
    m.insertAdjacentHTML('beforeend','<p>More practice, using new topics. Each challenge is checked automatically.</p>');
    EX.forEach((x,j)=>{const r=document.createElement('div');r.className='reto';r.innerHTML='<h3>'+(j+1)+'. '+x.n+'</h3><p>'+x.p+'</p>';r.appendChild(editor(x.s,x.k,'x'+j));m.appendChild(r)});
  }else{
    m.insertAdjacentHTML('beforeend',l.e);
    if(l.x)m.appendChild(l.x());
    m.insertAdjacentHTML('beforeend','<h3>Try it yourself</h3><p>This code is editable. Change it and run it to see what happens.</p>');
    m.appendChild(editor(l.c,null));
    if(l.r){const r=document.createElement('div');r.className='reto';r.innerHTML='<h3>Challenge</h3><p>'+l.r.p+'</p>';r.appendChild(editor(l.r.s,l.r.k,'l'+cur));m.appendChild(r)}
    if(l.y){const q=document.createElement('div');q.style.marginTop='30px';q.appendChild(l.y());m.appendChild(q)}
  }
  const nx=document.createElement('p');nx.style.marginTop='30px';
  if(cur<P.length-1){const b=document.createElement('button');b.className='b';b.textContent='Next';b.onclick=()=>{cur++;show();scrollTo(0,0)};nx.appendChild(b)}
  else nx.textContent='You finished the course! 🐾';
  m.appendChild(nx);
}
show();
</script>
